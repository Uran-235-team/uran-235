services:
  postgres:
    image: postgres:16
    container_name: uran-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uran}
      POSTGRES_DB: ${POSTGRES_DB:-uran}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uran} -d ${POSTGRES_DB:-uran}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: uran-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-uran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uran}
      POSTGRES_DB: ${POSTGRES_DB:-uran}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
