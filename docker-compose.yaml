services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16
    container_name: uran-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uran}
      POSTGRES_DB: ${POSTGRES_DB:-uran}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uran} -d ${POSTGRES_DB:-uran}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=super-secret-key-change-in-production
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_MINUTES=10080
    depends_on:
      redis:
        condition: service_healthy
    container_name: uran-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-uran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uran}
      POSTGRES_DB: ${POSTGRES_DB:-uran}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
