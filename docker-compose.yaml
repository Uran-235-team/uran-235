services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16
    container_name: uran-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uran}
      POSTGRES_DB: ${POSTGRES_DB:-uran}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uran} -d ${POSTGRES_DB:-uran}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: uran-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-uran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uran}
      POSTGRES_DB: ${POSTGRES_DB:-uran}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: super-secret-key-change-in-production
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      # Fixed list of exchanges (may be []). Each running emulator must match id+title here.
      EXCHANGES_JSON: '[{"id":"demo","title":"Демо биржа"}]'
      # Optional shared secret; must match EMULATOR_INGEST_SECRET on each emulator if set.
      EMULATOR_INGEST_SECRET: ""
    ports:
      - "8000:8000"

  emulator:
    build:
      context: ./emulator
      dockerfile: Dockerfile
    container_name: uran-emulator
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      EXCHANGE_ID: demo
      EXCHANGE_TITLE: Демо биржа
      API_INGEST_WS_URL: ws://api:8000/api/v1/ws/emulator
      EMULATOR_INGEST_SECRET: ""

volumes:
  postgres_data:
  redis_data:
